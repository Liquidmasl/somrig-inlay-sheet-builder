name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm version ${{ github.event.inputs.bump }} --no-git-tag-version

      - name: Get new version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Collect release notes from merged PRs
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NOTES=""
          if [ -n "$LAST_TAG" ]; then
            PR_NUMBERS=$(git log "${LAST_TAG}..HEAD" --merges --pretty=format:"%s" | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          else
            PR_NUMBERS=$(git log --merges --pretty=format:"%s" | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          fi
          for PR in $PR_NUMBERS; do
            BODY=$(gh pr view "$PR" --json body --jq '.body' 2>/dev/null || echo "")
            PR_NOTES=$(echo "$BODY" | sed -n '/^## Release Notes$/,/^## /p' | sed '$d' | tail -n +2)
            if [ -n "$PR_NOTES" ]; then
              NOTES="${NOTES}${PR_NOTES}"$'\n'
            fi
          done
          # Random delimiter: a fixed "EOF" lets a release note containing a
          # lone EOF line terminate the block early and inject further outputs.
          DELIM="notes-$(openssl rand -hex 16)"
          echo "notes<<${DELIM}" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "${DELIM}" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        # NOTES comes in via env, never via ${{ }} interpolation. GitHub
        # substitutes ${{ }} before bash parses the script, so PR-authored text
        # spliced in that way is executed as script: a note containing a double
        # quote breaks the release, and one containing $(...) runs on a runner
        # holding contents:write and the prod Netlify token.
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +%Y-%m-%d)
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n' > CHANGELOG.md
          fi
          TMP=$(mktemp)
          head -1 CHANGELOG.md > "$TMP"
          printf '\n## [%s] - %s\n\n%s\n' "$VERSION" "$DATE" "$NOTES" >> "$TMP"
          tail -n +2 CHANGELOG.md >> "$TMP"
          mv "$TMP" CHANGELOG.md

      - name: Build
        run: npm run build

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Tag and push
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}

      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --prod --dir=dist
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
